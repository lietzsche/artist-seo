<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a08" />
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0a08; color: #e3dacb; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 24px; }
  h1 { font-weight: 400; font-size: 1.8rem; margin: 0 0 .75rem; }
  p { margin: 0 0 1.5rem; color: #bdb3a4; font-family: system-ui, sans-serif; line-height: 1.7; }
  button { font: inherit; font-family: system-ui, sans-serif; padding: .7rem 1.4rem; background: #e3dacb; color: #0b0a08; border: 0; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You are offline</h1>
  <p>Please check your connection and try again.<br />인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button onclick="location.reload()">Retry · 다시 시도</button>
</main>
</body>
</html>
