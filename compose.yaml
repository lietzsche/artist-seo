name: artist-portfolio

# .env 파일이 없어도 개발용 기본값으로 실행된다.
# .env(또는 셸 환경 변수)에 같은 이름의 값이 있으면 그 값이 우선한다.
x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-artist}
  POSTGRES_USER: ${POSTGRES_USER:-artist}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-artist}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-artist}}
  STORAGE_ROOT: /data
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}

x-env-file: &env-file
  - path: .env
    required: false

services:
  gateway:
    build:
      context: ./apps/web
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - artist_public:/data/public:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    # 시작할 때마다 DB 마이그레이션을 먼저 적용한다
    # 시작 순서: 공개 파일 읽기 권한 보정(예전 버전이 0600으로 만든 파일) → 마이그레이션
    #           → ADMIN_EMAIL/ADMIN_PASSWORD 관리자 반영 → (SEED_DEMO_DATA=true이면) 데모 데이터
    command: ["sh", "-c", "find /data/public -type f ! -perm -o=r -exec chmod a+r {} + ; python -m app.migrate && python -m app.cli sync-admin && python -m app.cli seed-demo --if-enabled && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips '*'"]
    env_file: *env-file
    environment: *app-env
    volumes:
      - artist_originals:/data/originals
      - artist_public:/data/public
      - artist_tmp:/data/tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  media-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file: *env-file
    environment: *app-env
    volumes:
      - artist_originals:/data/originals
      - artist_public:/data/public
      - artist_tmp:/data/tmp
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5

  db:
    image: postgres:17.6-alpine
    environment: *db-env
    volumes:
      - artist_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    # cloudflared는 TUNNEL_TOKEN 환경 변수를 토큰으로 읽는다
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  artist_db:
  artist_originals:
  artist_public:
  artist_tmp:

