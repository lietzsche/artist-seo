name: artist-portfolio

services:
  gateway:
    build:
      context: ./apps/web
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - artist_public:/data/public:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    # 시작할 때마다 DB 마이그레이션을 먼저 적용한다
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips '*'"]
    env_file: .env
    volumes:
      - artist_originals:/data/originals
      - artist_public:/data/public
      - artist_tmp:/data/tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  media-worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - artist_originals:/data/originals
      - artist_public:/data/public
      - artist_tmp:/data/tmp
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5

  db:
    image: postgres:17.6-alpine
    env_file: .env
    volumes:
      - artist_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "$${CLOUDFLARE_TUNNEL_TOKEN}"]
    env_file: .env
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  artist_db:
  artist_originals:
  artist_public:
  artist_tmp:

